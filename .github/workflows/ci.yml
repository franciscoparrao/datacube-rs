name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test (workspace)
    runs-on: ubuntu-latest
    steps:
      # datacube-io depends on surtgis by path (../surtgis sibling checkout),
      # so both repos are checked out side by side under the workspace dir.
      - uses: actions/checkout@v4
        with:
          path: datacube-rs
      - uses: actions/checkout@v4
        with:
          repository: franciscoparrao/surtgis
          path: surtgis
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: datacube-rs
      - name: rustfmt
        working-directory: datacube-rs
        run: cargo fmt --all --check
      - name: clippy
        working-directory: datacube-rs
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (cli with stac)
        working-directory: datacube-rs
        run: cargo clippy -p datacube-cli --features stac -- -D warnings
      - name: clippy (python with stac)
        working-directory: datacube-rs
        run: cargo clippy -p datacube-python --features stac -- -D warnings
      - name: clippy (zarr with object-store)
        working-directory: datacube-rs
        run: cargo clippy -p datacube-zarr --all-targets --features object-store -- -D warnings
      - name: clippy (io with parquet)
        working-directory: datacube-rs
        run: cargo clippy -p datacube-io --all-targets --features parquet -- -D warnings
      - name: test
        working-directory: datacube-rs
        run: cargo test --workspace
      - name: test (zarr with object-store)
        working-directory: datacube-rs
        run: cargo test -p datacube-zarr --features object-store
      - name: test (io with parquet)
        working-directory: datacube-rs
        run: cargo test -p datacube-io --features parquet
